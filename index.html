<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Língua Inglesa | Colégio Ideal</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #F15A24; /* Laranja da Logo */
      --dark-purple: #2B1842;
      --card-white: #FFFFFF;
      --boy-bg: #81D4FA;
      --girl-bg: #F48FB1;
      --success-green: #2E7D32;
      --error-red: #C62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--primary-orange); /* Laranja idêntico ao da Logo */
      color: var(--dark-purple);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 15px 30px 15px;
      transition: background-color 0.4s ease;
      position: relative;
      overflow-x: hidden;
    }

    .bg-floaters {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      display: none;
    }

    .floater {
      position: absolute;
      font-size: 2rem;
      opacity: 0.35;
      animation: floatAnim 10s infinite linear;
    }

    @keyframes floatAnim {
      0% { transform: translateY(105vh) rotate(0deg); }
      100% { transform: translateY(-10vh) rotate(360deg); }
    }

    /* HEADER FIXO E SEMPRE VISÍVEL */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      width: 100%;
      background: var(--primary-orange);
      transition: background 0.4s ease;
    }

    .logo-card {
      background: var(--card-white);
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .logo-img {
      max-height: 60px;
      object-fit: contain;
    }

    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--card-white);
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      margin-bottom: 2px;
    }

    .app-header p {
      font-size: 0.9rem;
      color: var(--dark-purple);
      font-weight: 700;
    }

    .container {
      width: 100%;
      max-width: 600px;
      z-index: 5;
      position: relative;
      margin-top: 10px;
    }

    .page {
      display: none;
      background: var(--card-white);
      border-radius: 24px;
      padding: 22px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.35s ease-in-out;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CAIXA DE TEXTO COMPACTA COM SCROLLBAR */
    .summary-scrollbox {
      max-height: 250px;
      overflow-y: auto;
      padding: 15px;
      border: 2px dashed #F15A2444;
      border-radius: 14px;
      background-color: #FFFDFB;
      margin: 15px 0;
    }

    .summary-scrollbox::-webkit-scrollbar {
      width: 6px;
    }
    .summary-scrollbox::-webkit-scrollbar-thumb {
      background: var(--primary-orange);
      border-radius: 4px;
    }

    h2 {
      font-size: 1.25rem;
      color: var(--primary-orange);
      text-align: center;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .topic-title {
      font-weight: 700;
      color: var(--primary-orange);
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    p, li {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #444;
    }

    ul {
      margin-left: 18px;
      margin-bottom: 8px;
    }

    .example {
      background-color: #F4F4F6;
      padding: 6px 10px;
      border-left: 4px solid var(--dark-purple);
      border-radius: 6px;
      margin: 5px 0;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .btn {
      background-color: var(--primary-orange);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: block;
      margin: 15px auto 0 auto;
      transition: all 0.2s ease;
      box-shadow: 0 5px 14px rgba(241, 90, 36, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(241, 90, 36, 0.45);
      background-color: #D84A1A;
    }

    .btn:disabled {
      background-color: #D1D1D6;
      color: #8E8E93;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .teacher-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #FFFDFB;
      border: 2px solid var(--primary-orange);
      padding: 8px 16px;
      border-radius: 50px;
      margin: 0 auto 15px auto;
      width: fit-content;
    }

    .teacher-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--dark-purple);
    }

    .teacher-badge span {
      font-weight: 700;
      color: var(--dark-purple);
      font-size: 0.9rem;
    }

    .select-box {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.9rem;
      border: 2px solid #E5E5EA;
      border-radius: 12px;
      margin: 10px 0 15px 0;
      display: block;
      outline: none;
      background: #F9F9FB;
      font-weight: 500;
      color: var(--dark-purple);
      transition: border-color 0.2s;
    }

    .select-box:focus {
      border-color: var(--primary-orange);
      background: #FFFFFF;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #F0F0F3;
    }

    .timer-badge {
      background-color: var(--dark-purple);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .q-counter {
      font-weight: 700;
      color: var(--primary-orange);
      font-size: 0.9rem;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--dark-purple);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt-btn {
      background: #F9F9FB;
      border: 2px solid #E5E5EA;
      padding: 12px 16px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
      color: var(--dark-purple);
    }

    .opt-btn:hover {
      border-color: var(--primary-orange);
      background-color: #FFF8F5;
    }

    .opt-btn.selected {
      border-color: var(--primary-orange);
      background-color: #FFEAE0;
      font-weight: 700;
    }

    .unscramble-target {
      min-height: 50px;
      border: 2px dashed var(--primary-orange);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 12px;
      background: #FFFDFB;
    }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .word-chip {
      background: var(--dark-purple);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      user-select: none;
      transition: transform 0.1s;
    }

    .word-chip:active {
      transform: scale(0.95);
    }

    .feedback-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .feedback-box.correct {
      background-color: #E8F5E9;
      color: var(--success-green);
      border: 1px solid #A5D6A7;
    }

    .feedback-box.wrong {
      background-color: #FFEBEE;
      color: var(--error-red);
      border: 1px solid #FFCDD2;
    }
